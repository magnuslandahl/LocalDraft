name: Bundle and release

# Builds the complete, ready-to-run Windows bundle: the self-contained app plus
# the verified Whisper and Qwen models and the native whisper.cpp runtime.
#
# - pull requests that touch packaging: build only, to catch packaging breakage
# - pushes to main: build and upload downloadable artifacts
# - tags v*: build and publish a public GitHub Release for end users
#
# Model downloading happens here, in developer tooling only. The application
# itself never downloads anything at runtime.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'Models/manifest.json'
      - 'packaging/**'
      - 'src/LocalDraft.App/LocalDraft.App.csproj'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      run_model_tests:
        description: Also run the slow model-dependent integration tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  bundle:
    name: Windows bundle
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve the bundle version
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          }
          else {
              $version = "0.1.0-main.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Bundle version: $version"

      - name: Restore cached models and native runtime
        uses: actions/cache@v4
        with:
          path: |
            Models/Whisper
            Models/Text
            artifacts/whisper-bin-x64-b4938.zip
          key: localdraft-assets-${{ hashFiles('tools/fetch-models.ps1', 'Models/manifest.json') }}

      - name: Download and verify models and native runtime
        run: .\tools\fetch-models.ps1

      - name: Run the model-dependent integration tests
        if: ${{ inputs.run_model_tests }}
        run: dotnet test .\tests\LocalDraft.Infrastructure.Tests\LocalDraft.Infrastructure.Tests.csproj -c Release

      - name: Build and verify the portable bundle
        run: .\tools\build-portable.ps1 -SkipTests -Version '${{ steps.version.outputs.version }}'

      - name: Build the Windows installer
        run: .\tools\build-installer.ps1 -Version '${{ steps.version.outputs.version }}' -InstallInnoSetupIfMissing

      - name: Stage release assets and checksums
        run: .\tools\stage-release-assets.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload downloadable bundle
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: LocalDraft-win-x64-${{ steps.version.outputs.version }}
          path: artifacts/release
          retention-days: 14
          compression-level: 0

      - name: Publish the GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @((Get-ChildItem 'artifacts\release' -File).FullName)
          if ($files.Count -eq 0) { throw 'No release assets were staged.' }
          gh release create $env:GITHUB_REF_NAME @files --title "LocalDraft ${{ steps.version.outputs.version }}" --notes-file 'packaging\release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub Release.' }
